project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - experience.qmd
    - personal-projects.qmd
    - academic-projects.qmd
    - blog/**/*.qmd
    - skills.qmd
    - education.qmd
    - about.qmd
    - contact.qmd
    - content/machine-learning/**/*.qmd
    - content/programming/**/*.qmd
    - content/data-visualization/**/*.qmd
    # Rend l'échec de rename ("presentation_mtcars.html -> docs/...") qui
    # cassait le rendu de TOUT le site sur CI (broken depuis au moins le
    # 22/09/2026, aucune page publiée depuis). Exclue temporairement le
    # temps de diagnostiquer le cache freeze/l'exécution R sur le runner.
    - "!content/data-visualization/presentations/DATA_PRESENTATIONS/presentation_mtcars.qmd"
  resources:
    - images
    - assets/
    - content/machine-learning/
    - content/programming/
    - content/data-visualization/
    - blog/

# Reuse cached computational results for unchanged documents so CI doesn't need
# to re-execute every R/Python chunk (some of which depend on local hardware,
# e.g. audio/mic access, that a GitHub Actions runner does not have). See
# PUBLISHING.md for details. New content added via the listing/blog workflow
# below is plain Markdown with no code chunks, so it renders instantly either way.
execute:
  freeze: auto

website:
  title: "Djamal TOE, Data Scientist & Machine Learning Engineer"
  description: "Portfolio of Djamal TOE, combining statistics, biostatistics, machine learning, NLP, computer vision, and software engineering."
  open-graph: true
  twitter-card: true
  site-url: https://djamal2905.github.io/djamal_website/
  favicon: images/logo.png
  google-analytics:
    tracking-id: "G-KPNBXZFEP3"
    anonymize-ip: true

format:
  html:
    include-in-header:
      - meta/logo-schema.html
      - meta/theme-init.html
    theme: darkly
    css: styles.css
    toc: false
